four_wheel_steering_node:
  ros__parameters:
    cmd_vel_type: twist_stamped
    # The simulation launch overrides this with /cmd_vel_safe after starting
    # agri_base_adapter. Running this package alone retains the public /cmd_vel.
    cmd_vel_topic: /cmd_vel
    joint_states_topic: /joint_states
    steering_command_topic: /steering_controller/commands
    wheel_command_topic: /wheel_controller/commands
    odom_topic: /wheel/odom
    publish_tf: true
    odom_frame: odom
    base_frame: base_footprint
    update_rate: 50.0
    command_timeout: 0.5
    command_max_age: 0.5
    max_future_stamp_skew: 0.05
    joint_state_timeout: 0.25
    wheel_radius: 0.127
    max_wheel_speed: 8.0
    steering_limits: [-3.14159265, 3.14159265]
    # Hold drive at zero while a steering module is farther than 20 deg from
    # its target; ramp to full speed by 2.9 deg to avoid wheel scrub.
    steering_full_speed_error: 0.05
    steering_stop_error: 0.35
    # Planar wheel odometry. Z/roll/pitch are intentionally marked unobserved.
    pose_covariance_diagonal: [0.01, 0.01, 1000000.0, 1000000.0, 1000000.0, 0.04]
    twist_covariance_diagonal: [0.02, 0.02, 1000000.0, 1000000.0, 1000000.0, 0.08]
    # x is forward and y is left in base_footprint.  Verify these four values
    # against the final calibrated URDF wheel-joint origins.
    wheel_names: [f1, f2, r1, r2]
    wheel_positions: [0.228220185, 0.173029217, 0.221645830, -0.173022364, -0.221740059, 0.170487567, -0.228314645, -0.170488836]
    steering_joint_names: [f1_steer_joint, f2_steer_joint, r1_steer_joint, r2_steer_joint]
    wheel_joint_names: [f1_wheel_joint, f2_wheel_joint, r1_wheel_joint, r2_wheel_joint]
    # physical_value = joint_state_value * sign; joint_command = physical_command * sign
    # All steering axes map to -Z in base_footprint; all positive wheel axes
    # produce +X rolling velocity at steering zero. Verify again after URDF edits.
    steering_joint_signs: [-1.0, -1.0, -1.0, -1.0]
    # physical_heading = joint_position * sign + offset. Values come from the
    # imported CAD module zero headings measured in the 2026-10-07 diagnosis.
    steering_joint_offsets: [0.005596326794896633, -0.005638618281266784, 0.005638618185346499, -0.005638618281326736]
    wheel_joint_signs: [1.0, 1.0, 1.0, 1.0]
