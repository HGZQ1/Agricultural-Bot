base_velocity_gate:
  ros__parameters:
    manual_topic: /cmd_vel
    navigation_topic: /cmd_vel_nav
    output_topic: /cmd_vel_safe
    lock_command_topic: /base_motion/lock_cmd
    lock_state_topic: /base_motion/locked
    active_source_topic: /base_motion/active_source
    lock_service: /base_motion/set_lock
    frame_id: base_footprint
    publish_rate: 50.0
    # The gate stops before the lower four-wheel node's 0.5 s watchdog.
    manual_timeout: 0.35
    navigation_timeout: 0.35
    maximum_input_age: 0.5
    maximum_future_skew: 0.05
    # Stage-one limits: lateral travel is disabled until its physical limits
    # and stability have been accepted explicitly.
    max_linear_x: 0.30
    max_linear_y: 0.0
    max_angular_z: 0.50

base_odom_adapter:
  ros__parameters:
    input_topic: /wheel/odom
    output_topic: /odom
    odom_frame: odom
    base_frame: base_footprint
    maximum_age: 0.5
    maximum_future_skew: 0.05
