map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.30
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      # Four-wheel steering may spend several seconds changing steering angle
      # before an in-place heading correction. Count angular progress as well
      # as translation so that this valid transition is not aborted early.
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.05
      required_movement_angle: 0.10
      movement_time_allowance: 20.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      # Recheck XY while heading is corrected; four-wheel steering can shift
      # the base during a steering transition after first entering XY tolerance.
      stateful: false
      # Leave room for residual motion during cancellation/lock transitions;
      # the harvest route still accepts a final parked error of 0.10 m / 5 deg.
      xy_goal_tolerance: 0.07
      yaw_goal_tolerance: 0.05236
    FollowPath:
      # The shim closes the final yaw error after RPP reaches the station XY.
      # Path orientations stay at yaw 0 so a return path is handed to RPP for
      # reversing instead of triggering a 180 degree turn in the crop aisle.
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      angular_dist_threshold: 0.1745
      angular_disengage_threshold: 0.05236
      forward_sampling_distance: 0.50
      rotate_to_heading_angular_vel: 0.20
      max_angular_accel: 0.50
      max_cost_threshold: 254.0
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      # Replanning the same goal must not repeatedly interrupt RPP's curved
      # reverse approach to align to NavFn's identity path orientations.
      rotate_to_heading_once: true
      # Four-wheel steering has a steering-settle delay.  Closed-loop shim
      # acceleration repeatedly sees near-zero measured yaw rate during that
      # delay and clamps every command to 0.025 rad/s, below the useful
      # actuation range.  Open-loop acceleration ramps the command history to
      # 0.20 rad/s while the collision monitor still guards the footprint.
      closed_loop: false
      use_path_orientations: true
      desired_linear_vel: 0.15
      max_linear_vel: 0.25
      max_angular_vel: 0.45
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.80
      lookahead_time: 1.50
      use_velocity_scaled_lookahead_dist: true
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.70
      regulated_linear_scaling_min_speed: 0.05
      cost_scaling_dist: 0.40
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 5.0
      # The validated demo route is a narrow, single corridor.  Keep the robot
      # heading at yaw 0 and reverse along the same path for return goals so it
      # does not attempt an unsafe in-place turn beside the plants.
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.785
      allow_reversing: true
      transform_tolerance: 0.20
      stateful: true
    # Jazzy initializes the shim's position checker before assigning its
    # plugin name, so this private parameter starts with a dot. Keep its
    # position check live too, allowing RPP to correct any XY drift.
    .position_checker:
      stateful: false

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 10.0
    planner_plugins: [GridBased]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.20
      use_astar: false
      # Preserve the requested yaw=0 at every harvest and home goal.  Letting
      # NavFn replace it with the path tangent would turn return goals to pi.
      use_final_approach_orientation: false
      # The lidar leaves a small blind/unknown patch under the robot.  Allow
      # NavFn to leave that patch; demo clients must restrict goals to the
      # validated central corridor.
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.20
    simulate_ahead_time: 1.0
    max_rotational_vel: 0.35
    min_rotational_vel: 0.05
    rotational_acc_lim: 0.50

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    # Milliseconds for BT Action goal acknowledgements (not navigation time).
    # The GUI waypoint test hit compute_path_to_pose acknowledgement timeout
    # between stations despite successful navigation and parking at the prior
    # station. Allow scheduling/DDS latency while keeping each BT spin bounded
    # by half of bt_loop_duration. Nav2 must be reconfigured to load this value.
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[0.46, 0.36], [0.46, -0.36], [-0.50, -0.36], [-0.50, 0.36]]"
      # Keep 35 mm planning clearance.  The collision monitor retains the
      # slightly larger 40 mm hard-stop envelope below.
      footprint_padding: 0.035
      plugins: [obstacle_layer, inflation_layer]
      filters: [keepout_filter]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: true
          obstacle_min_range: 0.10
          obstacle_max_range: 4.0
          raytrace_min_range: 0.10
          raytrace_max_range: 4.0
          max_obstacle_height: 1.80
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # The 0.395 m padded half-width leaves a numerical/safety margin while
        # a 0.40 m radius removes the former ninth 5 cm inflation ring.
        cost_scaling_factor: 5.0
        inflation_radius: 0.40
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: /costmap_filter_info
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      track_unknown_space: true
      resolution: 0.05
      footprint: "[[0.46, 0.36], [0.46, -0.36], [-0.50, -0.36], [-0.50, 0.36]]"
      footprint_padding: 0.035
      plugins: [static_layer, obstacle_layer, inflation_layer]
      filters: [keepout_filter]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        # Mapping leaves an unobserved patch, and occasionally a stale return,
        # directly beneath the robot.  Clear only the current footprint so the
        # planner can leave its start pose; the surrounding static map remains.
        footprint_clearing_enabled: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: true
          obstacle_min_range: 0.10
          obstacle_max_range: 8.0
          raytrace_min_range: 0.10
          raytrace_max_range: 8.0
          max_obstacle_height: 1.80
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Match the local layer and RPP cost model for close harvest stops.
        cost_scaling_factor: 5.0
        inflation_radius: 0.40
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: /costmap_filter_info
      always_send_full_costmap: true

collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_nav_raw
    cmd_vel_out_topic: /cmd_vel_nav
    state_topic: /collision_monitor_state
    transform_tolerance: 0.20
    source_timeout: 0.50
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: [RobotStop]
    RobotStop:
      type: polygon
      # Stay 5 mm outside the planning footprint as a conservative hard stop.
      points: "[[0.50, 0.40], [0.50, -0.40], [-0.54, -0.40], [-0.54, 0.40]]"
      action_type: stop
      min_points: 4
      visualize: true
      polygon_pub_topic: /collision_monitor/robot_stop
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
      min_height: -0.40
      max_height: 1.80
      enabled: true
