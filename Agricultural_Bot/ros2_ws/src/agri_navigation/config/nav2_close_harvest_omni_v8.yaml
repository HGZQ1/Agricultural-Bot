# Opt-in v8: v7 plus upstream OPEN_LOOP velocity smoothing only.
# Select velocity_smoothing:=true AND both params_file/amcl_params_file:=this file.
# Jazzy 1.3.13 ramp timer is WALL time; .006 is m/s^2 of WALL time.
# It does not impose a constant SIM acceleration or a heading-rate limit.
# Raw stamped input timeout is .25 SIM s when use_sim_time is true.
# Normal output preserves the raw stamp. Native timeout resets frame_id empty
# and refreshes its internal zero-target stamp while braking; downstream
# frame/stamp gate must reject that expired-command residue. Collision and
# lock emergency zeros are downstream and bypass this ramp altogether.
# Original maps, footprint, keepout, AMCL, steering alignment .35 rad and
# reference velocity .5 rad/s / acceleration 1 rad/s^2 remain unchanged.
# Opt-in v7: v6 controller/safety configuration unchanged; AMCL motion model only.
# navigation.launch.py loads AMCL separately: explicitly pass BOTH
# params_file:=.../nav2_close_harvest_omni_v7.yaml AND
# amcl_params_file:=.../nav2_close_harvest_omni_v7.yaml.
# No runtime restart or localization reset is performed by this file.
# Opt-in close-harvest v6 StandardTrajectoryGenerator diagnostic candidate.
# The v5 LimitedAccelGenerator profile is retained unchanged for comparison.
# Standard samples over the prediction horizon, avoiding the 0.0025 m/s
# dynamic window whose 1.5 s endpoints stayed inside one 0.05 m grid cell.
# Prediction acceleration is 0.12 m/s^2; real 4WS wheel acceleration remains
# 0.8 rad/s^2 (0.1016 m/s^2 at 0.127 m wheel radius), with unchanged
# alignment/interlock guards.  Prediction deceleration remains -0.05 m/s^2.
# Raw commands are sampled target velocities, NOT a new physical slew limit.
# ObstacleFootprint has a nonzero 0.01 soft-cost weight.  Its unchanged
# lethal/unknown/off-grid rejection still runs; zero would disable the critic.
# At 0.05 m resolution, a legal inflated 253 cell costs 0.1265 instead of 12.65.
# A saved-map entrance proof is required: actual spawn is outside its rear edge.
# This candidate must not be used as evidence that spawn was map-validated.
# Select with params_file:=.../nav2_close_harvest_omni_v6.yaml and
# velocity_smoothing:=false, plus base_adapter_close_harvest_omni.yaml.
# All costmaps, Collision Monitor, progress/goal thresholds and recovery
# limits are copied unchanged from nav2_navigation.yaml.  Rectangular boundary
# checks precede other critics; independent filled-footprint route validation
# remains required.  Twirling discourages mid-route yaw;
# RotateToGoal closes final yaw.  This is a preference, not a hard yaw constraint.
# The 4WS measured steering and wheel acceleration guards remain authoritative.
# 11/11/5 axis samples, with extra zero samples, keep low-RTF work bounded.
# Local rolling costmap retains the baseline unknown policy.  Its 4 m window
# differs from the smaller saved-map boundary; preserve the independently
# validated route/unknown budget rather than expanding the operating domain.
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''
controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.05
      required_movement_angle: 0.1
      movement_time_allowance: 20.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: false
      xy_goal_tolerance: 0.07
      yaw_goal_tolerance: 0.05236
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      trajectory_generator_name: dwb_plugins::StandardTrajectoryGenerator
      limit_vel_cmd_in_traj: false
      min_vel_x: -0.12
      max_vel_x: 0.12
      min_vel_y: -0.08
      max_vel_y: 0.08
      max_vel_theta: 0.05
      min_speed_xy: 0.0
      max_speed_xy: 0.15
      min_speed_theta: 0.0
      acc_lim_x: 0.12
      acc_lim_y: 0.12
      acc_lim_theta: 0.1
      decel_lim_x: -0.05
      decel_lim_y: -0.05
      decel_lim_theta: -0.1
      vx_samples: 11
      vy_samples: 11
      vtheta_samples: 5
      sim_time: 1.5
      discretize_by_time: false
      linear_granularity: 0.025
      angular_granularity: 0.01
      include_last_point: true
      transform_tolerance: 0.2
      short_circuit_trajectory_evaluation: true
      debug_trajectory_details: false
      publish_evaluation: false
      publish_trajectories: false
      xy_goal_tolerance: 0.07
      trans_stopped_velocity: 0.01
      critics:
      - ObstacleFootprint
      - Oscillation
      - PathDist
      - GoalDist
      - RotateToGoal
      - Twirling
      ObstacleFootprint:
        scale: 0.01
        sum_scores: false
      Oscillation:
        scale: 1.0
        oscillation_reset_dist: 0.05
        oscillation_reset_angle: 0.2
      PathDist:
        scale: 16.0
      GoalDist:
        scale: 24.0
      RotateToGoal:
        scale: 20.0
        slowing_factor: 5.0
        lookahead_time: -1.0
      Twirling:
        scale: 20.0
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 10.0
    planner_plugins:
    - GridBased
    costmap_update_timeout: 1.0
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.2
      use_astar: false
      use_final_approach_orientation: false
      allow_unknown: true
behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 1.0
    max_rotational_vel: 0.35
    min_rotational_vel: 0.05
    rotational_acc_lim: 0.5
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: '[[0.46, 0.36], [0.46, -0.36], [-0.50, -0.36], [-0.50, 0.36]]'
      footprint_padding: 0.035
      plugins:
      - obstacle_layer
      - inflation_layer
      filters:
      - keepout_filter
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: true
          obstacle_min_range: 0.1
          obstacle_max_range: 4.0
          raytrace_min_range: 0.1
          raytrace_max_range: 4.0
          max_obstacle_height: 1.8
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.4
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: /costmap_filter_info
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      track_unknown_space: true
      resolution: 0.05
      footprint: '[[0.46, 0.36], [0.46, -0.36], [-0.50, -0.36], [-0.50, 0.36]]'
      footprint_padding: 0.035
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      filters:
      - keepout_filter
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        footprint_clearing_enabled: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: true
          obstacle_min_range: 0.1
          obstacle_max_range: 8.0
          raytrace_min_range: 0.1
          raytrace_max_range: 8.0
          max_obstacle_height: 1.8
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.4
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: /costmap_filter_info
      always_send_full_costmap: true
collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_nav_raw
    cmd_vel_out_topic: /cmd_vel_nav
    state_topic: /collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons:
    - RobotStop
    RobotStop:
      type: polygon
      points: '[[0.50, 0.40], [0.50, -0.40], [-0.54, -0.40], [-0.54, 0.40]]'
      action_type: stop
      min_points: 4
      visualize: true
      polygon_pub_topic: /collision_monitor/robot_stop
      enabled: true
    observation_sources:
    - scan
    scan:
      type: scan
      topic: /scan
      min_height: -0.4
      max_height: 1.8
      enabled: true

# Baseline AMCL parameters copied unchanged except the holonomic motion model.
amcl:
  ros__parameters:
    # The saved map and wheel odometry use this stable navigation frame chain.
    use_sim_time: true
    alpha1: 0.20
    alpha2: 0.20
    alpha3: 0.20
    alpha4: 0.20
    alpha5: 0.10
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    laser_model_type: likelihood_field
    laser_min_range: 0.10
    # The default map covers only the central aisle.  Ignore farther repeated
    # rows so AMCL scores the two borders of this aisle instead of aliases.
    laser_max_range: 1.8
    laser_likelihood_max_dist: 0.8
    max_beams: 90
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    sigma_hit: 0.20
    z_hit: 0.70
    z_rand: 0.30
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.10
    beam_skip_distance: 0.50
    beam_skip_error_threshold: 0.90
    beam_skip_threshold: 0.30
    do_beamskip: false
    update_min_d: 0.05
    update_min_a: 0.05
    transform_tolerance: 0.30
    tf_broadcast: true
    robot_model_type: nav2_amcl::OmniMotionModel
    set_initial_pose: true
    # The demonstration always starts from the fixed, reproducible spawn.
    always_reset_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    save_pose_rate: 0.5

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    smoothing_frequency: 50.0
    feedback: OPEN_LOOP
    scale_velocities: true
    stamp_smoothed_velocity_with_smoothing_time: false
    max_velocity: [0.12, 0.08, 0.05]
    min_velocity: [-0.12, -0.08, -0.05]
    max_accel: [0.006, 0.006, 0.02]
    max_decel: [-0.006, -0.006, -0.02]
    deadband_velocity: [0.0, 0.0, 0.0]
    odom_topic: /odom
    odom_duration: 0.1
    velocity_timeout: 0.25
