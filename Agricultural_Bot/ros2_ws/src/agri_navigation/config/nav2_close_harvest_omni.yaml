# Opt-in close-harvest DWB holonomic candidate; not the default profile.
# Select with params_file:=.../nav2_close_harvest_omni.yaml and
# velocity_smoothing:=false, plus base_adapter_close_harvest_omni.yaml.
# All costmaps, Collision Monitor, progress/goal thresholds and recovery
# limits are copied unchanged from nav2_navigation.yaml.  Complete rectangular
# footprint checks precede other critics.  Twirling discourages mid-route yaw;
# RotateToGoal closes final yaw.  This is a preference, not a hard yaw constraint.
# The 4WS measured steering and wheel acceleration guards remain authoritative.
# 11*11*5 samples and spatial sampling limit work under low simulation RTF.
# Local rolling costmap retains the baseline unknown policy.  Its 4 m window
# differs from the smaller saved-map boundary; preserve the independently
# validated route/unknown budget rather than expanding the operating domain.
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''
controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.05
      required_movement_angle: 0.1
      movement_time_allowance: 20.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: false
      xy_goal_tolerance: 0.07
      yaw_goal_tolerance: 0.05236
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      trajectory_generator_name: dwb_plugins::LimitedAccelGenerator
      min_vel_x: -0.12
      max_vel_x: 0.12
      min_vel_y: -0.08
      max_vel_y: 0.08
      max_vel_theta: 0.05
      min_speed_xy: 0.0
      max_speed_xy: 0.15
      min_speed_theta: 0.0
      acc_lim_x: 0.05
      acc_lim_y: 0.05
      acc_lim_theta: 0.1
      decel_lim_x: -0.05
      decel_lim_y: -0.05
      decel_lim_theta: -0.1
      vx_samples: 11
      vy_samples: 11
      vtheta_samples: 5
      sim_period: 0.05
      sim_time: 1.5
      discretize_by_time: false
      linear_granularity: 0.025
      angular_granularity: 0.01
      include_last_point: true
      transform_tolerance: 0.2
      short_circuit_trajectory_evaluation: true
      debug_trajectory_details: false
      publish_evaluation: false
      publish_trajectories: false
      xy_goal_tolerance: 0.07
      trans_stopped_velocity: 0.01
      critics:
      - ObstacleFootprint
      - Oscillation
      - PathDist
      - GoalDist
      - RotateToGoal
      - Twirling
      ObstacleFootprint:
        scale: 1.0
        sum_scores: false
      Oscillation:
        scale: 1.0
        oscillation_reset_dist: 0.05
        oscillation_reset_angle: 0.2
      PathDist:
        scale: 16.0
      GoalDist:
        scale: 24.0
      RotateToGoal:
        scale: 20.0
        slowing_factor: 5.0
        lookahead_time: -1.0
      Twirling:
        scale: 20.0
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 10.0
    planner_plugins:
    - GridBased
    costmap_update_timeout: 1.0
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.2
      use_astar: false
      use_final_approach_orientation: false
      allow_unknown: true
behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 1.0
    max_rotational_vel: 0.35
    min_rotational_vel: 0.05
    rotational_acc_lim: 0.5
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: '[[0.46, 0.36], [0.46, -0.36], [-0.50, -0.36], [-0.50, 0.36]]'
      footprint_padding: 0.035
      plugins:
      - obstacle_layer
      - inflation_layer
      filters:
      - keepout_filter
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: true
          obstacle_min_range: 0.1
          obstacle_max_range: 4.0
          raytrace_min_range: 0.1
          raytrace_max_range: 4.0
          max_obstacle_height: 1.8
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.4
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: /costmap_filter_info
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      track_unknown_space: true
      resolution: 0.05
      footprint: '[[0.46, 0.36], [0.46, -0.36], [-0.50, -0.36], [-0.50, 0.36]]'
      footprint_padding: 0.035
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      filters:
      - keepout_filter
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        footprint_clearing_enabled: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: true
          obstacle_min_range: 0.1
          obstacle_max_range: 8.0
          raytrace_min_range: 0.1
          raytrace_max_range: 8.0
          max_obstacle_height: 1.8
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.4
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: /costmap_filter_info
      always_send_full_costmap: true
collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_nav_raw
    cmd_vel_out_topic: /cmd_vel_nav
    state_topic: /collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons:
    - RobotStop
    RobotStop:
      type: polygon
      points: '[[0.50, 0.40], [0.50, -0.40], [-0.54, -0.40], [-0.54, 0.40]]'
      action_type: stop
      min_points: 4
      visualize: true
      polygon_pub_topic: /collision_monitor/robot_stop
      enabled: true
    observation_sources:
    - scan
    scan:
      type: scan
      topic: /scan
      min_height: -0.4
      max_height: 1.8
      enabled: true
