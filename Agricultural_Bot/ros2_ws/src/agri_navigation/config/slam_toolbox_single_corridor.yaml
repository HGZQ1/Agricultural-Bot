# SLAM Toolbox profile for the fixed-start, single-corridor demonstration.
#
# The tomato rows are highly repetitive.  With 2 m row spacing, the normal
# 3 m loop search can associate a scan in a neighbouring aisle with an aisle
# that was mapped earlier and make map -> odom jump.  This profile therefore
# keeps sequential scan matching but disables non-local loop closure.  Use it
# only for the central corridor from the fixed spawn pose; it is not intended
# to solve full-field global localization.
slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping
    use_map_saver: true

    resolution: 0.05
    map_update_interval: 2.0
    transform_publish_period: 0.02
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    restamp_tf: false
    min_laser_range: 0.10
    # Observe the two rows bordering the aisle, while excluding the next
    # repeated rows whose centerlines are about 3 m from the aisle center.
    max_laser_range: 1.8
    minimum_time_interval: 0.10
    throttle_scans: 1
    stack_size_to_use: 40000000
    enable_interactive_mode: true
    debug_logging: false

    # Keep local scan matching for smooth odometry correction.  Disabling loop
    # closure prevents a later scan from snapping to a visually identical row.
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.15
    minimum_travel_heading: 0.15
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: false
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
