amcl:
  ros__parameters:
    # The saved map and wheel odometry use this stable navigation frame chain.
    use_sim_time: true
    alpha1: 0.20
    alpha2: 0.20
    alpha3: 0.20
    alpha4: 0.20
    alpha5: 0.10
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    laser_model_type: likelihood_field
    laser_min_range: 0.10
    laser_max_range: 40.0
    laser_likelihood_max_dist: 2.0
    max_beams: 90
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    sigma_hit: 0.20
    z_hit: 0.70
    z_rand: 0.30
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.10
    beam_skip_distance: 0.50
    beam_skip_error_threshold: 0.90
    beam_skip_threshold: 0.30
    do_beamskip: false
    update_min_d: 0.05
    update_min_a: 0.05
    transform_tolerance: 0.30
    tf_broadcast: true
    robot_model_type: nav2_amcl::DifferentialMotionModel
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    save_pose_rate: 0.5
