# Functional-equivalent baseline; both backends use the same ROS contract.
mid360:
  frame_id: mid360_sensor_frame
  gz_topic: /mid360
  points_topic: /mid360/points
  update_rate: 10.0
  min_range: 0.1
  max_range: 40.0
  horizontal_samples: 1875
  vertical_samples: 32
  horizontal_min_angle: -3.141592653589793
  horizontal_max_angle: 3.141592653589793
  vertical_min_angle: -0.12217304763960307  # -7 degrees in the sensor frame
  vertical_max_angle: 0.9075712110370514    # +52 degrees in the sensor frame
  range_resolution: 0.01
  noise_stddev: 0.005
  visualize: true
  render_engine: ogre2
  rgl:
    install_prefix: .cache/rgl/install
    patterns_dir: .cache/rgl/source/RGLGazeboPlugin/lidar_patterns
    pattern_preset: Livox Mid360
